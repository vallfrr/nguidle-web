[package]
name = "ngu-browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
audit = []

[dependencies]
clr = { git = "https://github.com/vallfrr/nguidle-rust.git", tag = "v0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
panic = "abort"
