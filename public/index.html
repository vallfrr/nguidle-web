<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NGU Idle</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script>
<main id="surface" aria-label="NGU Idle">
  <canvas id="game" tabindex="0" aria-label="NGU Idle game"></canvas>
  <input id="game-text" aria-label="Game text field" type="text" autocomplete="off" spellcheck="false" hidden>
  <input id="save-file" aria-label="Import Save File" type="file" accept=".txt,text/plain" tabindex="-1" hidden>
  <p id="failure" role="alert" hidden></p>
</main>
</html>
