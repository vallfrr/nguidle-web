<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2730">
<title>NGU Idle</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<main id="shell">
  <header>
    <strong>NGU Idle</strong>
    <div class="actions">
      <button id="import" type="button">Import save</button>
      <button id="export" type="button">Export save</button>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
    <input id="save-file" type="file" accept=".txt,text/plain" hidden>
  </header>
  <section id="surface" aria-label="Game">
    <canvas id="game" tabindex="0" aria-label="NGU Idle game"></canvas>
    <p id="connecting" role="status">Starting NGU Idle…</p>
    <p id="drop" hidden>Drop a save file to import it</p>
  </section>
  <footer id="status" role="status"></footer>
</main>
<dialog id="text-dialog">
  <form id="text-form" method="dialog">
    <label for="game-text">Enter text</label>
    <input id="game-text" autocomplete="off" spellcheck="false">
    <menu>
      <button value="cancel">Cancel</button>
      <button value="apply">Apply</button>
    </menu>
  </form>
</dialog>
<dialog id="export-dialog">
  <form method="dialog">
    <strong>Export save</strong>
    <p id="export-help" hidden>Save the game to a numbered slot to download it here.</p>
    <ul id="export-list"></ul>
    <button>Close</button>
  </form>
</dialog>
<dialog id="import-dialog">
  <form method="dialog">
    <label for="import-slot">Import into an empty slot</label>
    <select id="import-slot"></select>
    <menu>
      <button value="cancel">Cancel</button>
      <button value="apply">Import</button>
    </menu>
  </form>
</dialog>
</html>
