name: Checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGU_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  web:
    name: Browser runtime and saves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --target wasm32-wasip1
      - name: Install check tools
        run: |
          python -m pip install ruff==0.11.13
          cargo +1.100.0 install --locked --version 1.43.0 just
      - name: Run the local checks
        run: just check
